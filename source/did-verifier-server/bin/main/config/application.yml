spring:
  application:
    name: Verifier
  profiles:
    # Active profiles:
    # - dev: Development environment (uses ApplicationVerifierServiceImpl with SDK)
    # - lss: LSS environment
    # For sample/test environment, use: sample (uses VerifierServiceSample with dummy data)
    active: dev, lss
    group:
        dev:
          - databases
          - wallet
          - logging
          - spring-docs
          - verifier
          - blockchain
        sample:
          - databases-sample
          - wallet
          - logging
          - spring-docs
          - verifier
        lss:
          - lss
  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false
  liquibase:
    change-log: classpath:/db/changelog/master.xml
    enabled: true
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5430/verifier
    username: omn
    password: omn
  jpa:
    open-in-view: true
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    org.omnione: debug

server:
  port: 8092

tas:
  url: http://10.48.17.129:8090

wallet:
  file-path: /Users/jinhwan-notebook/workspace/did-orchestrator-server/source/did-orchestrator-server/shells/Besu/../../jars/Verifier/verifier.wallet
  password: omnioneopendid12!@

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: ASC
    operations-sorter: method
    disable-swagger-default-url: true
    display-request-duration: true
  api-docs:
    path: /api-docs
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health, shutdown, refresh
  endpoint:
    shutdown:
      enabled: true
    startup:
      enabled: true

# OID4VP 서명 검증 설정
# skip-signature-verification: true 로 설정 시 VP/VC 서명 검증을 건너뜁니다.
# Mock Wallet처럼 실제 서명이 없는 개발/테스트 환경에서만 사용하세요.
# 실제 앱 연동 시에는 반드시 false로 설정하거나 항목을 제거하세요.
oid4vp:
  dev:
    skip-signature-verification: false