spring:
  application:
    name: did-verifier-server-test

  liquibase:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
        hbm2ddl:
          auto: create-drop
          # Hibernate가 create-drop 스키마 생성 직후, 같은 SessionFactory 부트스트랩 호출 안에서
          # classpath:import.sql(src/test/resources/import.sql)을 동기적으로 실행한다 — Spring Boot의
          # data.sql(이벤트 기반, 순서 보장이 fragile함)보다 이 조합에서 더 결정적이다. oid4vp_config
          # seed row가 VerifierConfigService의 @PostConstruct(다른 빈보다 먼저 실행될 수 있음) 이전에
          # 반드시 존재해야 하기 때문에 이 방식을 사용한다.

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true

logging:
  level:
    root: WARN
    org.omnione.did: DEBUG

# Verifier 설정
verifier:
  did: did:example:verifier-test-001
  name: Test Verifier
  certVcRef: cert-vc-001
  ref: https://example.com/test

# 서버 포트
server:
  port: 8092
