# Verifier 설정
# VerifierProperty에서 로드됩니다 (@ConfigurationProperties(prefix = "verifier"))

verifier:
  # Verifier DID (필수)
  did: "did:omn:verifier"
  
  # Verifier 이름 (필수)
  name: "OpenDID Verifier"
  
  # Verifier 가입증명서 VC URL (Optional)
  certVcRef: "http://127.0.0.1:8092/verifier/cert-vc"
  
  # Verifier 참조 URL (Optional, 예: 홈페이지)
  ref: "https://www.opendid.org"
  
  # Verifier 도메인 (Optional)
  domain: "verifier.opendid.org"
  
  # TAS URL
  tasUrl: "http://localhost:8090"
  
  # Verifier API Endpoint 목록
  verifierEndPoints:
    - "http://127.0.0.1:8092/verifier/api/v1"

  status-list:
    # true=FAIL-CLOSED(엄격, 기본), false=FAIL-OPEN(가용성 우선)
    fail-on-fetch-error: true
    # Status List Token의 ttl claim 상한 (초)
    max-cache-ttl-seconds: 86400
    # Status List Token의 ttl claim 하한 (초)
    min-cache-ttl-seconds: 60
    # SSRF 방지 차원에서 status_list.uri가 사설망/loopback으로 resolve되면 기본적으로 차단한다.
    # 로컬 개발망이나 폐쇄망 배포처럼 status list 호스트가 사설 IP인 게 정상인 경우에만
    # 아래에 정확한 host 문자열을 등록해 예외 처리한다.
    allowed-private-hosts:
      - "192.168.3.110"
